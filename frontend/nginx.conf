# 前端容器的网关：静态资源 + 把 /api、/ws 转给 backend:8000
#
# 前端代码全程只认同源相对路径（API_BASE=/api、WS_URL=同源 /ws/dashboard），
# 所以「换端口、换域名、上 HTTPS」都不用改一行前端代码，只动这里。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库文档/报告导出可能带附件，默认 1m 会 413
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 单页应用：/reports/33 刷新时磁盘上没有这个文件，必须回 index.html，
    # 否则刷新就 404（演示时最常见的一脚）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带 hash，可以长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一次巡园含 90s 渗透等待，报告生成也在同一请求里，60s 会断
        proxy_read_timeout 180s;
    }

    # 大屏/画布 WebSocket：必须带 Upgrade，否则 ws 握手直接 400
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 大屏是长连接，别按默认 60s 掐断（前端 20s 一次 ping，正常不会触发）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
