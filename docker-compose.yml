# 「知秋」茶园多智能体平台 · 六服务一键启动（PRD 21.2）
# 用法：cp .env.example .env  →  docker compose up -d  →  http://localhost:8000/docs
#
# 默认拉起 5 个服务：backend / mysql / redis / mosquitto / chroma
# 需要控制台（队友A 的前端）时加 profile：
#   docker compose --profile ui up -d      → http://localhost:5173
# 前端镜像两段式构建（node 编译 → nginx 托管），nginx 负责把 /api、/ws 转给 backend。
name: zhiqiu

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: zhiqiu-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiqiu}
      MYSQL_USER: ${MYSQL_USER:-zhiqiu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=300
    ports:
      # 宿主机默认 3307：本机常已装 MySQL 占着 3306，避免一键启动直接失败
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/zhiqiu.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------- Redis 7（带密码）----------
  redis:
    image: redis:7-alpine
    container_name: zhiqiu-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 里设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------- Mosquitto 2（账号 + 持久化）----------
  mosquitto:
    build:
      context: ./deploy/mosquitto
    container_name: zhiqiu-mosquitto
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER:-tea}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 .env 里设置 MQTT_PASSWORD}
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # 用带账号的订阅端自检：能连上并收到 $SYS 主题即算健康
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u $$MQTT_USER -P $$MQTT_PASSWORD -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------- Chroma 向量库（队长 knowledge/ 使用）----------
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: zhiqiu-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_HOST: 0.0.0.0
    ports:
      # 宿主机 8100 → 容器内 8000（PRD 19.5 端口表）
      - "${CHROMA_HOST_PORT:-8100}:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # ---------- 后端 FastAPI ----------
  backend:
    build:
      context: ./backend
    container_name: zhiqiu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 开发期热更代码：改本地文件不必重建镜像
      - ./backend:/app
      # 上传文件落到具名卷，避免混进代码目录
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      # Chroma 只服务队长的 RAG 知识库；镜像 1GB+，网络差时不让它拖住整个平台启动
      chroma:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------- 前端控制台（队友A，profile=ui）----------
  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
    container_name: zhiqiu-frontend
    restart: unless-stopped
    ports:
      # 宿主机 5173 与开发态 `npm run dev` 同端口，演示脚本不用改
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  mosquitto_data:
  chroma_data:
  uploads:
