# Mosquitto 2 配置（PRD 5.1：QoS1，账号认证）
# 密码文件放 /mosquitto/data 里 → 落在具名卷 mosquitto_data 上，重启不丢
listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

# 报文上限放宽到 256KB（遥测报文很小，留余量给未来的批量上报）
max_packet_size 262144

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
